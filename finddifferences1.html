<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מצאו את ההבדלים — סול</title>
<style>
  @font-face {
    font-family: "SysHeb";
    src: local("Segoe UI");
  }

  :root {
    --bg: #EDF3F1;
    --bg-soft: #E1ECE9;
    --card: #FFFFFF;
    --ink: #22302C;
    --ink-soft: #55655F;
    --teal: #1E7A76;
    --teal-dark: #145A57;
    --teal-rgb: 30, 122, 118;
    --gold: #C9963E;
    --gold-soft: #F0D9A8;
    --gold-rgb: 201, 150, 62;
    --plum: #8E4585;
    --rose: #D98BA5;
    --shadow: rgba(34, 48, 44, 0.18);
    --focus: #145A57;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15211F;
      --bg-soft: #1B2C29;
      --card: #1F332F;
      --ink: #F1ECDD;
      --ink-soft: #B9C6C0;
      --teal: #5BCCC2;
      --teal-dark: #3A9A92;
      --teal-rgb: 91, 204, 194;
      --gold: #E8BE73;
      --gold-soft: #4A3B22;
      --gold-rgb: 232, 190, 115;
      --plum: #CE8CC6;
      --rose: #F3AFC7;
      --shadow: rgba(0, 0, 0, 0.5);
      --focus: #5BCCC2;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #15211F;
    --bg-soft: #1B2C29;
    --card: #1F332F;
    --ink: #F1ECDD;
    --ink-soft: #B9C6C0;
    --teal: #5BCCC2;
    --teal-dark: #3A9A92;
    --teal-rgb: 91, 204, 194;
    --gold: #E8BE73;
    --gold-soft: #4A3B22;
    --gold-rgb: 232, 190, 115;
    --plum: #CE8CC6;
    --rose: #F3AFC7;
    --shadow: rgba(0, 0, 0, 0.5);
    --focus: #5BCCC2;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #EDF3F1;
    --bg-soft: #E1ECE9;
    --card: #FFFFFF;
    --ink: #22302C;
    --ink-soft: #55655F;
    --teal: #1E7A76;
    --teal-dark: #145A57;
    --teal-rgb: 30, 122, 118;
    --gold: #C9963E;
    --gold-soft: #F0D9A8;
    --gold-rgb: 201, 150, 62;
    --plum: #8E4585;
    --rose: #D98BA5;
    --shadow: rgba(34, 48, 44, 0.18);
    --focus: #145A57;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  .home-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 40;
    width: 52px;
    height: 52px;
    border-radius: 999px;
    background: #17A79B;
    border: none;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .home-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
  .home-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
  .home-btn svg { width: 26px; height: 26px; }

  @media (max-width: 640px) {
    .home-btn { width: 44px; height: 44px; top: 8px; left: 8px; }
    .home-btn svg { width: 22px; height: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .home-btn { transition: none; }
    .home-btn:hover { transform: none; }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    direction: rtl;
  }

  body {
    font-family: "Segoe UI", "SysHeb", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(60rem 40rem at 85% -10%, rgba(var(--gold-rgb), 0.16), transparent 60%),
      radial-gradient(50rem 36rem at -10% 110%, rgba(var(--teal-rgb), 0.14), transparent 60%),
      var(--bg);
  }

  .stage {
    max-width: 68rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    gap: 1.9rem;
  }

  /* ---------- Header ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.3rem;
    animation: rise 0.7s ease both;
  }

  .hero-text h1 {
    margin: 0;
    font-size: clamp(1.9rem, 4.4vw, 2.8rem);
    font-weight: 800;
    line-height: 1.15;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .hero-text h1 .accent {
    color: var(--teal);
  }

  .hero-text p {
    margin: 0.5rem auto 0;
    max-width: 34rem;
    color: var(--ink-soft);
    font-size: 1.02rem;
    line-height: 1.55;
  }

  /* ---------- Staff progress ---------- */
  .staff-wrap {
    background: var(--card);
    border-radius: 1.4rem;
    padding: 1.15rem 1.3rem;
    box-shadow: 0 0.6rem 1.6rem var(--shadow);
    display: flex;
    align-items: center;
    gap: 1rem;
    animation: rise 0.7s ease 0.08s both;
  }

  .staff {
    position: relative;
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.4rem 0.2rem;
  }

  .staff::before {
    content: "";
    position: absolute;
    inset-inline: 0.6rem;
    top: 50%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ink-soft) 8%, var(--ink-soft) 92%, transparent);
    opacity: 0.28;
    transform: translateY(-1px);
  }

  .note-pin {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    background: none;
    border: none;
    cursor: default;
    font-family: inherit;
  }

  .note-pin .dot {
    width: 2.15rem;
    height: 2.15rem;
    border-radius: 999px;
    background: var(--bg-soft);
    border: 2px solid var(--ink-soft);
    opacity: 0.45;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.35s, border-color 0.35s, opacity 0.35s, box-shadow 0.35s;
  }

  .note-pin.found .dot {
    background: linear-gradient(155deg, var(--gold), var(--teal));
    border-color: transparent;
    color: #241a06;
    opacity: 1;
    box-shadow: 0 0.3rem 0.7rem rgba(var(--gold-rgb), 0.45);
    transform: translateY(-0.2rem) scale(1.08);
  }

  .note-pin.found.pop .dot {
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .note-pin .label {
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .staff-count {
    flex: none;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--teal-dark);
    background: var(--gold-soft);
    padding: 0.5rem 0.8rem;
    border-radius: 0.8rem;
    white-space: nowrap;
  }

  :root[data-theme="dark"] .staff-count,
  @media (prefers-color-scheme: dark) {
    .staff-count { color: var(--ink); }
  }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.3rem;
    animation: rise 0.7s ease 0.16s both;
  }

  @media (max-width: 42rem) {
    .board { grid-template-columns: 1fr; }
  }

  .frame {
    margin: 0;
    position: relative;
    background: var(--card);
    border-radius: 1.6rem;
    padding: 0.6rem;
    box-shadow: 0 1rem 2.2rem var(--shadow);
  }

  .frame .badge {
    position: absolute;
    top: 1.1rem;
    inset-inline-start: 1.1rem;
    z-index: 3;
    width: 2rem;
    height: 2rem;
    border-radius: 999px;
    background: var(--card);
    color: var(--teal-dark);
    font-weight: 800;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0.25rem 0.5rem var(--shadow);
  }

  :root[data-theme="dark"] .frame .badge,
  @media (prefers-color-scheme: dark) { .frame .badge { color: var(--gold); } }

  .frame .canvas {
    position: relative;
    overflow: hidden;
    border-radius: 1.15rem;
    aspect-ratio: 820 / 813;
    cursor: crosshair;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* magic lens */
  .lens {
    position: absolute;
    width: 9.5rem;
    height: 9.5rem;
    margin-inline-start: -4.75rem;
    margin-top: -4.75rem;
    border-radius: 999px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    background: radial-gradient(circle, rgba(var(--teal-rgb), 0.28), rgba(var(--teal-rgb), 0) 70%);
    mix-blend-mode: plus-lighter;
    z-index: 2;
    will-change: transform, background;
  }

  .canvas:hover .lens, .canvas.touched .lens {
    opacity: 1;
  }

  /* found markers */
  /* The ring sits ON the difference, and is measured against the picture.

     It used to be centred with margin-inline-start, which on this page (dir="rtl") means
     margin-RIGHT — and a right margin does not move a box that is placed by "left". So every ring
     was drawn half a ring to the right of the thing it was pointing at: the cat's collar got a ring
     over the sheet music beside it, and the one by the plant ran off the edge of the picture and
     was cut in half. margin-left does move it. Measured: rings were 18-31px from their difference
     before, 0-10px after.

     The size is a percentage of the picture rather than a fixed 2.6rem. A fixed ring keeps its 42px
     while the picture shrinks, so on a phone it swelled to a fifth of the width and could not fit
     beside the edge at all. As a percentage it looks the same on every screen. Percentage margins
     resolve against the container WIDTH — including margin-top — so both halves match. */
  .marker {
    position: absolute;
    box-sizing: border-box;
    width: 10%;
    aspect-ratio: 1;
    margin-left: -5%;
    margin-top: -5%;
    border-radius: 999px;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 3px rgba(var(--gold-rgb), 0.25), 0 0.3rem 0.6rem rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(0.5px);
    animation: ringpop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* the tick shrinks with the ring around it */
  .marker svg { width: 55%; height: 55%; color: var(--gold); }

  .hint-ring {
    position: absolute;
    width: 3.6rem;
    height: 3.6rem;
    margin-inline-start: -1.8rem;
    margin-top: -1.8rem;
    border-radius: 999px;
    border: 3px solid var(--teal);
    z-index: 3;
    pointer-events: none;
    animation: hintpulse 1.1s ease-in-out 3;
  }

  .ripple {
    position: absolute;
    width: 2.4rem;
    height: 2.4rem;
    margin-inline-start: -1.2rem;
    margin-top: -1.2rem;
    border-radius: 999px;
    border: 2px solid rgba(var(--teal-rgb), 0.55);
    z-index: 3;
    pointer-events: none;
    animation: ripple 0.55s ease-out forwards;
  }

  .spark {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    font-size: 1rem;
    color: var(--gold);
    animation: spark 0.7s ease-out forwards;
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    animation: rise 0.7s ease 0.22s both;
  }

  .hint-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    background: var(--card);
    color: var(--ink);
    border: none;
    border-radius: 999px;
    padding: 0.7rem 1.2rem;
    font-size: 0.98rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0.5rem 1.1rem var(--shadow);
    transition: transform 0.15s ease;
  }

  .hint-btn:hover { transform: translateY(-1px); }
  .hint-btn:active { transform: translateY(0px) scale(0.98); }
  .hint-btn svg { width: 1.2rem; height: 1.2rem; color: var(--teal); }

  .sound-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .sound-toggle input { accent-color: var(--teal); width: 1.05rem; height: 1.05rem; }

  button:focus-visible, .sound-toggle:focus-within {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Discovery log ---------- */
  .log {
    background: var(--card);
    border-radius: 1.3rem;
    padding: 1.1rem 1.3rem;
    box-shadow: 0 0.6rem 1.6rem var(--shadow);
    animation: rise 0.7s ease 0.28s both;
  }

  .log h2 {
    margin: 0 0 0.6rem;
    font-size: 0.98rem;
    font-weight: 800;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }

  .log ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    min-height: 1.6rem;
  }

  .log li {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.95rem;
    animation: slidein 0.35s ease both;
  }

  .log li .n {
    flex: none;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 999px;
    background: linear-gradient(155deg, var(--gold), var(--teal));
    color: #241a06;
    font-size: 0.68rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .log .empty {
    color: var(--ink-soft);
    opacity: 0.7;
    font-size: 0.92rem;
  }

  /* ---------- Win overlay ---------- */
  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 18, 16, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 50;
    animation: fadein 0.4s ease both;
  }

  .win-overlay[hidden] {
    display: none;
  }

  .win-card {
    background: var(--card);
    border-radius: 1.6rem;
    padding: 2.2rem 2rem;
    max-width: 26rem;
    width: 100%;
    text-align: center;
    box-shadow: 0 1.5rem 3rem rgba(0,0,0,0.35);
    animation: winpop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .win-card h2 {
    margin: 0.3rem 0 0.4rem;
    font-size: 1.7rem;
    font-weight: 800;
  }

  .win-card p {
    margin: 0 0 1.3rem;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .win-card .medal {
    font-size: 3.2rem;
    display: block;
  }

  .replay-btn {
    background: linear-gradient(155deg, var(--teal), var(--teal-dark));
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.85rem 1.7rem;
    font-size: 1rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0.6rem 1.2rem rgba(var(--teal-rgb), 0.35);
  }

  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    top: -2rem;
    font-size: 1.3rem;
    animation: fall linear forwards;
  }

  /* ---------- Keyframes ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(0.6rem); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateX(-0.4rem); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.35); }
    100% { transform: scale(1.08) translateY(-0.2rem); }
  }
  @keyframes ringpop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes hintpulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.25); opacity: 0.25; }
  }
  @keyframes ripple {
    0% { transform: scale(0.4); opacity: 0.9; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(1); opacity: 0; }
  }
  @keyframes fadein {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes winpop {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fall {
    to { transform: translateY(112vh) rotate(var(--rot)); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* On a phone the fixed home button sits over the title — reserve its corner
     rather than shrinking anything. */
  @media (max-width: 640px) { .hero { padding-left: 60px; } }

/* ---------- Sol lesson navigation (next / previous) ---------- */
/* Smaller than the home button: it keeps the exact corner, size and colour
   it holds on every page of the platform, and the arrows read as secondary
   to it.

   The row sits directly BELOW the home button, not beside it. Beside it was
   the first choice and it looked right in isolation, but measured against
   the real pages it covered a control on 6 of 11 lessons, because most
   lessons put their own control row at exactly that height. The left margin
   under the home button is empty on every lesson.

   They sit in a row rather than at fixed
   coordinates each, so a lesson that has only one of them keeps it snug
   against the home button instead of leaving a hole where the other would
   have been. The row is forced to LTR so the arrows keep their order on a
   right-to-left page. */
.sol-nav {
    position: fixed;
    top: 72px;
    left: 12px;
    height: 38px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    direction: ltr;
}
.sol-nav-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.sol-nav-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
.sol-nav-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
.sol-nav-btn svg { width: 20px; height: 20px; }
@media (max-width: 640px) {
    .sol-nav { top: 58px; left: 8px; height: 34px; gap: 6px; }
    .sol-nav-btn { width: 34px; height: 34px; }
    .sol-nav-btn svg { width: 18px; height: 18px; }
}
@media (prefers-reduced-motion: reduce) {
    .sol-nav-btn { transition: none; }
    .sol-nav-btn:hover { transform: none; }
}
</style>
</head>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <a class="sol-nav-btn sol-nav-back" href="https://hanibarsol.github.io/room-puzzle/" target="_top" aria-label="אחורה">

  </a>
</div>

<div class="stage">
  <header class="hero">
    <div class="hero-text">
      <h1>מצאו את <span class="accent">תשעת</span> ההבדלים</h1>

<script>
(function () {
  "use strict";

  var NOTES = [
    { key: "face",    fx: 0.4043, fy: 0.1823, fr: 0.075, note: "דו",  freq: 261.63, text: "הציור על הכן קיבל הבעה עצובה" },
    { key: "apron",   fx: 0.5851, fy: 0.2766, fr: 0.050, note: "רה",  freq: 293.66, text: "פרח אדום הופיע על הסינר" },
    { key: "palette", fx: 0.5674, fy: 0.3753, fr: 0.060, note: "מי",  freq: 329.63, text: "צבעי הפלטה הפכו לגוונים של ירוק" },
    { key: "cat",     fx: 0.3418, fy: 0.4396, fr: 0.055, note: "פה",  freq: 349.23, text: "לחתלתול יש עכשיו קולר כחול" },
    { key: "belt",    fx: 0.1312, fy: 0.6862, fr: 0.045, note: "סול", freq: 392.00, text: "אבזם טורקיז הופיע על החגורה של אבא" },
    { key: "scooter", fx: 0.5000, fy: 0.5968, fr: 0.055, note: "לה",  freq: 440.00, text: "ידית הקורקינט הירוק שינתה צבע" },
    { key: "door",    fx: 0.8152, fy: 0.1876, fr: 0.040, note: "סי",  freq: 493.88, text: "אחת מידיות הדלת נעלמה" },
    { key: "shoes",   fx: 0.8191, fy: 0.9007, fr: 0.055, note: "דו׳", freq: 523.25, text: "הנקודות בנעל השמאלית הפכו לצהובות" },
    /* nudged left of the leaf itself: this one sits against the right edge of the picture, and a
       whole ring has to fit there without touching the door ring beside it. The extra leaf is at
       0.9622, still well inside both the ring and the tap circle. */
    { key: "leaf",    fx: 0.9400, fy: 0.1907, fr: 0.040, note: "רה׳", freq: 587.33, text: "לעציץ שליד הדלת יש עלה נוסף" }
  ];

  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var found = {};
  var foundCount = 0;
  var audioCtx = null;
  var audioReadyPromise = null;

  var staffEl = document.getElementById("staff");
  var staffCountEl = document.getElementById("staffCount");
  var logList = document.getElementById("logList");
  var logEmpty = document.getElementById("logEmpty");
  var winOverlay = document.getElementById("winOverlay");
  var confettiLayer = document.getElementById("confetti");
  var soundToggle = document.getElementById("soundToggle");

  var canvases = [
    { el: document.getElementById("canvasA"), lens: document.getElementById("lensA") },
    { el: document.getElementById("canvasB"), lens: document.getElementById("lensB") }
  ];

  // Build staff pins
  NOTES.forEach(function (n, i) {
    var pin = document.createElement("div");
    pin.className = "note-pin";
    pin.id = "pin-" + i;
    pin.setAttribute("role", "listitem");
    var dot = document.createElement("div");
    dot.className = "dot";
    dot.textContent = n.note;
    var label = document.createElement("div");
    label.className = "label";
    label.textContent = "♪";
    pin.appendChild(dot);
    pin.appendChild(label);
    staffEl.appendChild(pin);
  });

  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (!audioCtx) return null;
    // Every caller shares this one resume() call/promise instead of each tap
    // kicking off its own — concurrent independent resume() calls on a fresh
    // context are what caused early finds to stay silent on some phones before
    // the context settled into "running".
    if (!audioReadyPromise) {
      if (audioCtx.state === "running") {
        audioReadyPromise = Promise.resolve();
      } else {
        var ctxRef = audioCtx;
        audioReadyPromise = new Promise(function (resolve) {
          var done = false;
          var settle = function () { if (!done) { done = true; resolve(); } };
          // Some browsers/devices can leave resume()'s promise pending
          // indefinitely — don't let that permanently silence every future
          // tone. Proceed after a short timeout regardless, best-effort.
          try { ctxRef.resume().then(settle, settle); } catch (e) { settle(); }
          setTimeout(settle, 400);
        });
      }
    }
    return audioCtx;
  }

  // Unlock audio on the very first touch/click anywhere on the page, not just
  // on a canvas tap, so it's already resuming before the child finds their first difference.
  ["pointerdown", "touchend"].forEach(function (evt) {
    document.addEventListener(evt, function firstTouch() {
      ensureAudio();
      document.removeEventListener(evt, firstTouch);
    }, { passive: true });
  });

  function playTone(freq, delaySec, duration) {
    if (!soundToggle.checked) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    duration = duration || 0.5;

    function fire() {
      var t = ctx.currentTime + (delaySec || 0);
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.05);
    }

    // On a freshly created/resumed context the audio thread isn't reliably "live"
    // yet — a tone scheduled in that same tick can be silently dropped. Wait for
    // the shared resume() promise to genuinely settle before scheduling; once
    // running, this resolves immediately.
    if (ctx.state === "running") {
      fire();
    } else {
      audioReadyPromise.then(fire);
    }
  }

  function playChord(freqs, delaySec) {
    freqs.forEach(function (f) { playTone(f, delaySec, 1.1); });
  }

  function spawnSparks(canvasEl, px, py) {
    if (reducedMotion) return;
    var colors = ["var(--gold)", "var(--teal)", "var(--plum)"];
    for (var i = 0; i < 7; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      s.textContent = "♪";
      var angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.5;
      var dist = 34 + Math.random() * 26;
      s.style.setProperty("--sx", (Math.cos(angle) * dist) + "px");
      s.style.setProperty("--sy", (Math.sin(angle) * dist) + "px");
      s.style.left = px + "px";
      s.style.top = py + "px";
      s.style.color = colors[i % colors.length];
      canvasEl.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 750); })(s);
    }
  }

  function addMarker(canvasEl, fx, fy) {
    var m = document.createElement("div");
    m.className = "marker";
    m.style.left = (fx * 100) + "%";
    m.style.top = (fy * 100) + "%";
    m.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.5l2.2 2.2L16 9.5"/><circle cx="12" cy="12" r="9.2"/></svg>';
    canvasEl.appendChild(m);
  }

  function addRipple(canvasEl, px, py) {
    if (reducedMotion) return;
    var r = document.createElement("div");
    r.className = "ripple";
    r.style.left = px + "px";
    r.style.top = py + "px";
    canvasEl.appendChild(r);
    setTimeout(function () { r.remove(); }, 600);
  }

  function updateProgress() {
    staffCountEl.textContent = foundCount + " מתוך " + NOTES.length;
  }

  function addLogEntry(index, note) {
    if (logEmpty) { logEmpty.remove(); logEmpty = null; }
    var li = document.createElement("li");
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = note.note;
    var t = document.createElement("span");
    t.textContent = note.text;
    li.appendChild(n);
    li.appendChild(t);
    logList.appendChild(li);
  }

  function markFound(index, px, py, sourceCanvasEl) {
    if (found[index]) return;
    found[index] = true;
    foundCount++;
    var note = NOTES[index];

    canvases.forEach(function (c) {
      addMarker(c.el, note.fx, note.fy);
    });

    if (sourceCanvasEl) spawnSparks(sourceCanvasEl, px, py);

    var pin = document.getElementById("pin-" + index);
    pin.classList.add("found", "pop");
    setTimeout(function () { pin.classList.remove("pop"); }, 550);

    addLogEntry(index, note);
    updateProgress();
    playTone(note.freq, 0, 0.55);

    if (foundCount === NOTES.length) {
      setTimeout(celebrate, 550);
    }
  }

  function celebrate() {
    NOTES.forEach(function (n, i) {
      playTone(n.freq, i * 0.14, 0.4);
    });
    setTimeout(function () {
      playChord([261.63, 329.63, 392.00], 0);
    }, NOTES.length * 140 + 150);

    winOverlay.hidden = false;
    if (!reducedMotion) spawnConfetti();
  }

  function spawnConfetti() {
    var glyphs = ["♪", "♫", "✦", "★"];
    var colors = ["var(--gold)", "var(--teal)", "var(--plum)", "var(--rose)"];
    for (var i = 0; i < 46; i++) {
      var p = document.createElement("div");
      p.className = "confetti-piece";
      p.textContent = glyphs[i % glyphs.length];
      p.style.left = (Math.random() * 100) + "vw";
      p.style.color = colors[i % colors.length];
      p.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
      var dur = 2.6 + Math.random() * 2.2;
      p.style.animationDuration = dur + "s";
      p.style.animationDelay = (Math.random() * 0.6) + "s";
      confettiLayer.appendChild(p);
      (function (el, total) { setTimeout(function () { el.remove(); }, total * 1000 + 700); })(p, dur);
    }
  }

  function nearestUnfound(fx, fy) {
    var best = -1, bestD = Infinity;
    NOTES.forEach(function (n, i) {
      if (found[i]) return;
      var dx = n.fx - fx, dy = n.fy - fy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    });
    return { index: best, dist: bestD };
  }

  function handlePointer(canvasEl, clientX, clientY, isClick) {
    var rect = canvasEl.getBoundingClientRect();
    var px = clientX - rect.left;
    var py = clientY - rect.top;
    var fx = px / rect.width;
    var fy = py / rect.height;

    if (isClick) {
      var hit = -1;
      var hitDist = Infinity;
      for (var i = 0; i < NOTES.length; i++) {
        if (found[i]) continue;
        var n = NOTES[i];
        var dx = (fx - n.fx) * rect.width;
        var dy = (fy - n.fy) * rect.height;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var hitR = Math.max(n.fr * rect.width, 26) * 1.25;
        // Pick the nearest candidate whose radius contains the tap, not just the
        // first in array order — on narrow screens the 26px touch-target floor
        // can make two nearby differences' radii overlap.
        if (dist <= hitR && dist < hitDist) { hit = i; hitDist = dist; }
      }
      if (hit >= 0) {
        markFound(hit, px, py, canvasEl);
      } else {
        addRipple(canvasEl, px, py);
      }
      return;
    }

    // hover: move lens + warm it near an undiscovered difference
    var pair = canvases.filter(function (c) { return c.el === canvasEl; })[0];
    if (!pair) return;
    canvases.forEach(function (c) {
      c.lens.style.transform = "translate(" + px + "px," + py + "px)";
    });
    if (!reducedMotion) {
      var near = nearestUnfound(fx, fy);
      var t = near.index === -1 ? 0 : Math.max(0, 1 - near.dist / 0.22);
      var teal = "rgba(var(--teal-rgb), " + (0.28).toFixed(2) + ")";
      var warm = "rgba(var(--gold-rgb), " + (0.15 + t * 0.55).toFixed(2) + ")";
      canvases.forEach(function (c) {
        c.lens.style.background = "radial-gradient(circle, " + warm + ", rgba(var(--teal-rgb),0) 70%)";
      });
    }
  }

  canvases.forEach(function (c) {
    c.el.addEventListener("pointermove", function (e) {
      c.el.classList.add("touched");
      handlePointer(c.el, e.clientX, e.clientY, false);
    });
    c.el.addEventListener("pointerleave", function () {
      c.el.classList.remove("touched");
    });
    c.el.addEventListener("pointerdown", function (e) {
      ensureAudio();
      handlePointer(c.el, e.clientX, e.clientY, true);
    });
  });

  document.getElementById("hintBtn").addEventListener("click", function () {
    ensureAudio();
    var undiscovered = [];
    NOTES.forEach(function (n, i) { if (!found[i]) undiscovered.push(i); });
    if (undiscovered.length === 0) return;
    var idx = undiscovered[Math.floor(Math.random() * undiscovered.length)];
    var n = NOTES[idx];
    canvases.forEach(function (c) {
      var ring = document.createElement("div");
      ring.className = "hint-ring";
      ring.style.left = (n.fx * 100) + "%";
      ring.style.top = (n.fy * 100) + "%";
      c.el.appendChild(ring);
      setTimeout(function () { ring.remove(); }, 3400);
    });
  });

  document.getElementById("replayBtn").addEventListener("click", function () {
    found = {};
    foundCount = 0;
    updateProgress();
    document.querySelectorAll(".marker").forEach(function (m) { m.remove(); });
    document.querySelectorAll(".note-pin").forEach(function (p) { p.classList.remove("found", "pop"); });
    logList.innerHTML = '<li class="empty" id="logEmpty">עוד לא נמצאו הבדלים — התחילו לחפש!</li>';
    logEmpty = document.getElementById("logEmpty");
    winOverlay.hidden = true;
    confettiLayer.innerHTML = "";
  });

  updateProgress();
})();
</script>

<script>
/* sol-home-back: the home button returns the child to the page they came from.

   The Smoove address written into the button carries a portal id, and Smoove issues a different
   one per account — the id here is Hani's. It therefore worked for her and sent every real
   customer to a portal they are not signed in to, which answers with a login screen in the
   middle of a lesson. Her friend found it on 2026-08-26: signed in as Hani everything worked,
   signed in as herself the button broke. Proved fixed by the same friend on her own account.

   Going back carries no id, so each child lands in their own portal on the page they left.
   If there is nothing behind us — the lesson was opened in a fresh tab — the original href
   still runs, so the button is never dead. */
(function () {
  var home = document.querySelector('a[href*="portal.smoove.io"][href*="Category"]');
  if (!home) return;
  home.addEventListener("click", function (e) {
    if (window.history.length <= 1) return;
    e.preventDefault();
    var wasAt = location.href;
    window.history.back();
    setTimeout(function () {
      if (location.href === wasAt) {
        try { window.top.location.href = home.href; } catch (err) { location.href = home.href; }
      }
    }, 500);
  });
})();
</script>
